# Minab — Windows CI for Minab Windows
#
# Builds the Tauri v2 + Rust app on a GitHub-hosted windows-latest
# runner (this repo has no Windows SDK locally — everything Windows
# happens here) and, when a v* tag is pushed, publishes the
# installer(s) as a pre-release named "Minab Windows <tag>".
#
# Release pattern follows the Android workflow
# (Minab-Children-OpenVPN, .github/workflows/build-android.yml):
# the tag name drives the release name and the release body comes
# from the tag itself (${{ github.ref_name }}), and the body covers
# ONLY that version's changes — older notes live in CHANGELOG.md.
# When adding a version, replace the body section below and move
# the old one to CHANGELOG.md first.
#
# Triggers are globs ("minab-windows-*", "v*") — the Android repo
# taught us the lesson with v0.9.1: exact version lists silently
# skip the next tag, so the release ships with no installer until
# the triggers are fixed. Use globs, never an exact list.
#
# Signing: v0.1.0 is UNSIGNED. Code signing (and bundling
# openvpn.exe + the TAP driver in the installer) is a later pass —
# see docs/windows-vpn-approach.md. Do not claim a signed build
# until a signing step is added here.
name: Minab Windows

permissions:
  contents: write

on:
  push:
    branches: ["minab-windows-*"]
    tags: ["v*"]
  pull_request:
    branches: ["minab-windows-*"]

jobs:
  build:
    name: "Build Minab Windows (Tauri)"
    runs-on: windows-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') { npm ci } else { npm install }

      # The source icon is src-tauri/icons/icon.png (copied from the
      # Android repo's misc/icon-512.png). Tauri needs the derived
      # icon.ico / icon.icns; generate them only when icon.ico is
      # missing, so a committed icon set is never overwritten.
      - name: Generate Tauri icons if needed
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/icons/icon.ico')) {
            npx @tauri-apps/cli icon src-tauri/icons/icon.png
          } else {
            Write-Host "icon.ico already present, skipping icon generation."
          }

      - name: Build Tauri app
        run: npm run tauri build

      - name: List built bundles
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem src-tauri/target/release/minab-windows.exe -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minab-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/minab-windows.exe
          # warn, not error: which bundle types exist depends on
          # tauri.conf.json (MSI vs NSIS), so a missing bundle type
          # must not fail a good build.
          if-no-files-found: warn
          retention-days: 7
          # Artifacts are only a temporary copy of the release
          # installer: keep them 7 days, so branch builds stop
          # adding installer copies to the free artifact storage.
          # Releases themselves are unaffected.

  release:
    name: "Publish GitHub Pre-Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: minab-windows-${{ github.ref_name }}
          path: dist

      - name: List downloaded artifacts
        run: find dist -type f -print

      # The release step is tag-driven: tag_name and the release
      # name come from the pushed tag (v0.1.0 -> "Minab Windows
      # v0.1.0"), so a hotfix tag needs no workflow change.
      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Minab Windows ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: dist/*
          # Release body = THIS version only. Older notes live in CHANGELOG.md.
          # The version in this body comes from the tag itself
          # (${{ github.ref_name }}), never hardcoded text, so it
          # cannot name the wrong version after a bump. When adding
          # a version, replace this section and move the old one to
          # CHANGELOG.md first.
          body: |
            Minab Windows ${{ github.ref_name }} — Windows companion to the Android Minab OpenVPN client. Pre-release, unsigned installer.

            Built in memory of the 168 children of Minab Elementary School.

            New in ${{ github.ref_name }} — first Windows scaffold (v0.1.0):
            import .ovpn profiles, connect/disconnect through the official
            OpenVPN 2.x openvpn.exe (driven over its management interface),
            and a ping test for profiles, in a UI that mirrors the Android app.

            Install: download the .msi installer below and run it on Windows.
            Connecting needs administrator rights — run the app as
            administrator (elevated relaunch of openvpn.exe is a later
            pass — see docs/windows-vpn-approach.md). The installer does not yet
            bundle openvpn.exe or the TAP driver: install OpenVPN 2.x
            from openvpn.net first, or point the app at an existing install.

            Android version: https://github.com/meiyou313/Minab-Children-OpenVPN
            Older versions: see CHANGELOG.md in this repo.
