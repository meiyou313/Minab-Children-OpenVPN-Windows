[package]
name = "minab-windows"
version = "0.1.0"
description = "Minab OpenVPN for Windows — Tauri v2 + Rust backend driving the official openvpn.exe"
authors = ["Minab"]
edition = "2021"

[lib]
name = "minab_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Blocking HTTP client (ip-api.com geo lookup). No tokio: std threads only.
ureq = "2"
